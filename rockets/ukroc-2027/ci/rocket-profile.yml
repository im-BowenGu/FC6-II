name: Rocket profile verification

on:
  pull_request:
  push:
    branches: [main, c6-main]

jobs:
  ukroc-2027:
    name: UKROC 2027 firmware + trajectory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Profile host tests, manifest and trajectory checks
        run: make -C rockets/ukroc-2027 test

  additive-guard:
    name: PR must not delete upstream files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream baseline
        run: |
          git remote add upstream https://github.com/kevin-rao1/FC6-II.git || true
          git fetch --no-tags --depth=1 upstream c6-main

      - name: No deletions and no README rewrite
        run: |
          deleted="$(git diff --diff-filter=D --name-only FETCH_HEAD HEAD)"
          if [ -n "$deleted" ]; then
            echo "Pull request deletes upstream files:"
            echo "$deleted"
            exit 1
          fi
          if ! git diff --quiet FETCH_HEAD HEAD -- README.md; then
            echo "README.md must stay identical to upstream"
            exit 1
          fi
          echo "Additive-only change set confirmed"
