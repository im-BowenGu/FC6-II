# Rough, reviewable model manifest for the S-LX guided rocket.
# This is a systems-engineering index, not a CAD kernel or a flight claim.
rocket:
  id: s-lx
  name: S-LX
  competition: UKROC 2027 (TARC 750 ft target)
  team: ASRC school rocketry club
  motor:
    type: single-stage solid
    manufacturer: AeroTech
    designation: F32
    diameter_mm: 24
    total_impulse_Ns: 56.9
    propellant_mass_g: 64
    delay_s: 4
    max_impulse_rule_Ns: 80
    approved_list: true
    digest: 337c2384aa7c96644eed28153bd00ac8
  constraints:
    min_length_mm: 650
    max_liftoff_mass_g: 650
    min_outer_diameter_mm: 66
    min_primary_tube_length_mm: 300
    min_secondary_tube_diameter_delta_mm: 9
    payload: two raw hen eggs, 55-63 g each, <=45 mm diameter, uncracked
    tether_all_non_wadding_parts: true
  target:
    apogee_m: 229.0
    apogee_ft: 750
    apogee_tolerance_m: 5.0
    duration_min_s: 34.0
    duration_max_s: 37.0

guidance:
  profile_include: include/slx_profile.h
  profile_source: src/slx_profile.c
  target: src/s-lx-bluepill-f103
  loop_hz: 100
  sensors: [BMP280 barometer, ICM-20689 IMU]
  actuator: PCA9685 driving four movable fins
  canards: false
  radio: false
  gnss: false
  pyro: false
  ground_control: false
  boost_tilt_deg: 1.9
  boost_start_s: 0.30
  boost_end_s: 2.20
  gains: {k_alt: 0.010, k_vel: 0.080, k_apogee: 0.200}
  apogee_drag_g: 1.55
  coast_weathervane_tilt_deg: 3.0
  servo: {center_us: 1500, us_per_deg: 40, min_us: 900, max_us: 2100, max_deflection_deg: 15}

aero:
  model: Taichi/CUDA static force/torque lookup + OpenRocket F32 plant
  freestream_mps: 26.0
  air_density_kg_m3: 1.225
  reference_cd0: 1.01068
  fit_inputs: sim/data/cfd/fluidx3d/logs/*_force.csv
  fit_manifest: sim/data/cfd/fluidx3d/configs/manifest.json
  live_sweep: cfd/run_live_cfd.py
  live_inputs: cfd/fin_states.yaml, cad/fin_plate.stl
  live_output: build/cfd/logs/*_force.csv + build/cfd/motion.json
  live_runner: local machine with Taichi 1.7+ and CUDA; env TAICHI_PYTHON, TAICHI_LD_LIBRARY_PATH
  replay_command: sim/run_dynamic_sim.py --check --motion build/cfd/motion.json
  excluded_from_fit: [xmix_p4, xmix_p8]
  exclusion_reason: 4 deg deflection is below the 5.38 mm voxel scale
  canopy_cda_m2: 0.150
  canopy_cd: 0.865
  movable_boundary_cfd: roadmap-only, see cfd/README.md

models:
  openrocket:
    - cad/models/S-LX.ork
    - cad/models/S-LX-ESP32C3.ork
    - cad/models/S-LX-STM32F103.ork
  nose_cone:
    generator: cad/generate_nose_cone_stl.py (in the main rocket project)
    stl: cad/nose_cone_ogive_66mm_150mm.stl (generated, not committed here)
    shape: ogive, 66 mm OD, 150 mm length
  fin:
    stl_generator: cad/generate_fin_plate_stl.py
    stl: cad/fin_plate.stl
    hinge_definitions: cfd/fin_states.yaml
  rocket_envelope_stl:
    source: rocket/cfd/fluidx3d/UKROC_2027_cfd.stl (main rocket project), copied here as cfd/fluidx3d/S-LX_cfd.stl
    note: saved 20k-step freeform-fin geometry used for the frozen lookup

verification:
  host_tests: tests/test_slx_profile.c
  simulator: sim/run_dynamic_sim.py
  ci_command: make -C rockets/s-lx ci
  ci_script: rockets/s-lx/ci/run-local.sh
  ci_live_command: make -C rockets/s-lx ci-live
  offline_command: make -C rockets/s-lx test
  logs: sim/logs/{mode}.csv, sim/logs/{mode}.events.jsonl, sim/logs/summaries.json
  checks:
    - nominal guided apogee within 229 +/- 5 m
    - nominal duration within 34-37 s
    - 0.35 sensor-noise apogee within 229 +/- 5 m
    - 5 deg rail-exit offset apogee within 229 +/- 5 m
    - 5 deg offset enters 1 deg band within 1.5 s
    - coast fins stay within +/- 15 deg
    - 5 m/s wind apogee within 229 +/- 10 m and no fin saturation
  limitations:
    - static force lookup, not moving-boundary CFD
    - fixed-fin OpenRocket drag/thrust history
    - servo lag, damping and stability are analytic approximations
    - no hardware-in-the-loop bench yet
