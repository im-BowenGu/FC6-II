name: Rocket profile verification

on:
  pull_request:
  push:
    branches: [main, c6-main]

jobs:
  s-lx:
    name: S-LX firmware + live CFD trajectory gate (UKROC 2027)
    # FluidX3D needs OpenCL; GitHub-hosted runners have no usable device.
    # The runner must expose FLUIDX3D_SRC (FluidX3D checkout with src/ and
    # makefile) and, if needed, OCL_LIB / ICD for the OpenCL ICD.
    runs-on: [self-hosted, fluidx3d-opencl]
    steps:
      - uses: actions/checkout@v4

      - name: Host tests, live fin-state CFD and recorded-motion flight check
        run: make -C rockets/s-lx cfd-test

  additive-guard:
    name: PR must not delete upstream files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream baseline
        run: |
          git remote add upstream https://github.com/kevin-rao1/FC6-II.git || true
          git fetch --no-tags --depth=1 upstream c6-main

      - name: No deletions and no README rewrite
        run: |
          deleted="$(git diff --diff-filter=D --name-only FETCH_HEAD HEAD)"
          if [ -n "$deleted" ]; then
            echo "Pull request deletes upstream files:"
            echo "$deleted"
            exit 1
          fi
          if ! git diff --quiet FETCH_HEAD HEAD -- README.md; then
            echo "README.md must stay identical to upstream"
            exit 1
          fi
          echo "Additive-only change set confirmed"
